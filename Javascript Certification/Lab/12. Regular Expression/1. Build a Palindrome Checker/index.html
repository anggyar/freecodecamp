<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="styles.css"/>
    <title>Palindrome Checker</title>
  </head>
  <body>
    <main class="container">
      <img class="logo"/>
      <h1 class="title">Is it a Palindrome?</h1>
      <div class="palindrome-div">
        <label for="text-input">Masukan Text untuk Cek Palindrom!</label>
        <input class="palindrome-input" id="text-input" type="text" value=""></input>
        <button class="palindrome-btn" id="check-btn">Check</button>
        <div class="results-div hidden" id="result"></div>
      </div>

      <div class="palindrome-definition-div">
        <p class="palindrome-definition">A <dfn>Palindrome</dfn> is a word or sentences that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>

      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
